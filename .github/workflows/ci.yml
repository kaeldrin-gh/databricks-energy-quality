name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests (no workspace needed)
        run: python -m pytest -q

  bundle:
    runs-on: ubuntu-latest
    # Databricks CLI output contains the workspace user path (plain and
    # URL-encoded), the workspace email and the workspace host; mask them all so
    # this public log stays free of personal details.
    env:
      LOG_MASK: >-
        s#/Workspace/Users/[^/]+#/Workspace/Users/***#g;
        s#%2FWorkspace%2FUsers%2F[^%]+#%2FWorkspace%2FUsers%2F***#g;
        s#[A-Za-z0-9._%+-]+%40[A-Za-z0-9.-]+#***%40***#g;
        s#%40[A-Za-z0-9.-]+#%40***#g;
        s#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}#***@***#g;
        s#^( *User: ).*#\1***#;
        s#https://[a-z0-9-]+\.cloud\.databricks\.com#https://***.cloud.databricks.com#g
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: databricks/setup-cli@main

      # Forks and PRs without the secrets stay green: validation and deploy
      # only run when a Free Edition workspace token is configured.
      - name: Check for Databricks credentials
        id: creds
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -n "$DATABRICKS_TOKEN" ]; then
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          else
            echo "configured=no" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABRICKS_HOST/DATABRICKS_TOKEN secrets are not set - skipping bundle validate and deploy."
          fi

      - name: Validate bundle
        if: steps.creds.outputs.configured == 'yes'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          databricks bundle validate -t free 2>&1 | sed -E "$LOG_MASK"

      - name: Deploy bundle (main only)
        if: steps.creds.outputs.configured == 'yes' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          pip install build
          databricks bundle deploy -t free 2>&1 | sed -E "$LOG_MASK"

      - name: Publish dashboard (main only)
        if: steps.creds.outputs.configured == 'yes' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          python scripts/publish_dashboard.py -t free 2>&1 | sed -E "$LOG_MASK"
