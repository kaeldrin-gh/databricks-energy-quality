name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests (no workspace needed)
        run: python -m pytest -q

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: databricks/setup-cli@main

      # Forks and PRs without the secrets stay green: validation and deploy
      # only run when a Free Edition workspace token is configured.
      - name: Check for Databricks credentials
        id: creds
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -n "$DATABRICKS_TOKEN" ]; then
            echo "configured=yes" >> "$GITHUB_OUTPUT"
          else
            echo "configured=no" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABRICKS_HOST/DATABRICKS_TOKEN secrets are not set - skipping bundle validate and deploy."
          fi

      - name: Validate bundle
        if: steps.creds.outputs.configured == 'yes'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t free

      - name: Deploy bundle (main only)
        if: steps.creds.outputs.configured == 'yes' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install build
          databricks bundle deploy -t free
