bundle:
  name: databricks-energy-quality

include:
  - resources/*.yml

# Free Edition has one workspace; keep the catalog a variable so the bundle
# works anywhere. Find yours with `SHOW CATALOGS` in the SQL editor.
variables:
  catalog:
    description: Unity Catalog catalog for the medallion tables
    default: workspace
  schema:
    description: Schema for the medallion tables
    default: energy_quality
  warehouse_id:
    description: SQL warehouse used by the dashboard (resolved by name at deploy)
    lookup:
      warehouse: Serverless Starter Warehouse

artifacts:
  default:
    type: whl
    build: python -m build
    path: .

targets:
  # One plain target: resource names match the repository; the job runs once
  # a day at 06:30 Europe/Berlin (see resources/job.yml) to stay within quota.
  free:
    default: true
