bundle:
  name: databricks-energy-quality

include:
  - resources/*.yml

# Free Edition has one workspace; keep the catalog a variable so the bundle
# works anywhere. Find yours with `SHOW CATALOGS` in the SQL editor.
variables:
  catalog:
    description: Unity Catalog catalog for the medallion tables
    default: workspace
  schema:
    description: Schema for the medallion tables
    default: energy_quality
  warehouse_id:
    description: SQL warehouse used by the dashboard (resolved by name at deploy)
    lookup:
      warehouse: Serverless Starter Warehouse

artifacts:
  default:
    type: whl
    build: python -m build
    path: .

targets:
  # Development copies for trying changes without touching prod data. Development
  # mode prefixes the job, pipeline and dashboard names with [dev <user>], the
  # schema with dev_<user>_, pauses the schedule and runs the pipeline in
  # development mode.
  dev:
    mode: development
    default: true

  # The daily job and the tables the dashboard reads. The job runs once a day
  # at 06:30 Europe/Berlin (see resources/job.yml) to stay within quota.
  prod:
    mode: production
    workspace:
      # The first deployments used a target named `free`; keeping its root
      # path keeps the existing job, pipeline and tables in this target's state.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/free
