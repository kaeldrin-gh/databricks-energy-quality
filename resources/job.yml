resources:
  jobs:
    energy_quality_job:
      name: energy-quality-daily
      # Runs once a day; the first deploys kept it paused until the pipeline
      # was verified end to end.
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: Europe/Berlin
        pause_status: UNPAUSED
      # Serverless tasks take their libraries from the job environment; task
      # level `libraries` is rejected with INVALID_PARAMETER_VALUE.
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: ingest
          environment_key: default
          # SMARD is the only network call in the job; retry it twice, ten
          # minutes apart, before the run fails.
          max_retries: 2
          min_retry_interval_millis: 600000
          notebook_task:
            notebook_path: ../src/notebooks/ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: transform
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.prices_pipeline.id}

        - task_key: quality
          environment_key: default
          depends_on:
            - task_key: transform
          notebook_task:
            notebook_path: ../src/notebooks/quality_report.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
