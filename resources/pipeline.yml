resources:
  pipelines:
    prices_pipeline:
      name: energy-quality-prices
      catalog: ${var.catalog}
      schema: ${resources.schemas.energy_quality.name}
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        # Timestamps are UTC; gold_daily converts to German market days itself.
        spark.sql.session.timeZone: UTC
        landing_path: /Volumes/${var.catalog}/${resources.schemas.energy_quality.name}/landing/smard
      libraries:
        - notebook:
            path: ../src/notebooks/pipeline.py
