resources:
  volumes:
    # Unity Catalog managed volume: the ingest task lands raw SMARD files here
    # and the pipeline reads them with Auto Loader.
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: landing
      volume_type: MANAGED
      comment: Raw SMARD day-ahead price batches (JSON lines), one file per ingest run.
